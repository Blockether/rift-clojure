name: Release & Deploy to Clojars

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  # Wrapper patch releases (e.g. v0.0.10-1) still build the vendored native source
  # from the upstream rift tag they wrap.
  RIFT_REF: v0.0.10

jobs:
  # ---------------------------------------------------------------------------
  # Build librift_ffi for every platform AND run the Clojure binding test
  # against the freshly-built library. linux-x64 / linux-arm64 / darwin-arm64
  # build+test NATIVELY. darwin-x64 is CROSS-built on the Apple-Silicon
  # (macos-14) runner — Xcode's macOS SDK is universal, so the M1 emits a
  # valid Intel dylib in seconds instead of waiting ~14 min on a slow,
  # scarce macos-13 Intel runner — and its binding test runs under Rosetta 2
  # with an x86_64 JVM (an arm64 JVM cannot FFM-load an x86_64 dylib). The
  # binding picks the prebuild by os.arch, and Rosetta makes the JVM report
  # x86_64, so the test exercises the cross-built x64 lib for real.
  # fail-fast aborts the whole release if any platform fails, and the
  # `release` job has `needs: natives` — so NOTHING is deployed to Clojars
  # unless all four platforms built and tested green. Each job uploads its
  # validated library; the release job bundles them into the published jar.
  # ---------------------------------------------------------------------------
  natives:
    name: build + test ${{ matrix.name }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: linux-x64,    os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  lib: librift_ffi.so,    jdk-arch: x64 }
          - { name: linux-arm64,  os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, lib: librift_ffi.so,    jdk-arch: aarch64 }
          - { name: darwin-arm64, os: macos-14,         target: aarch64-apple-darwin,      lib: librift_ffi.dylib, jdk-arch: aarch64 }
          - { name: darwin-x64,   os: macos-14,         target: x86_64-apple-darwin,       lib: librift_ffi.dylib, jdk-arch: x64, rosetta: true }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout rift-clojure
        uses: actions/checkout@v6

      - name: Checkout rift source (${{ env.RIFT_REF }})
        uses: actions/checkout@v6
        with:
          repository: anomalyco/rift
          ref: ${{ env.RIFT_REF }}
          path: rift-src

      - name: Install cmake (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Install cmake (macOS)
        if: runner.os == 'macOS'
        run: brew list cmake >/dev/null 2>&1 || brew install cmake

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Cache the Cargo registry + rift-ffi target dir so the cdylib does NOT
      # cold-compile from scratch on every run. The cold release build of
      # rift-ffi + all transitive crates is what ballooned the old Intel-mac
      # (macos-13) job to ~14 min; a warm cache cuts subsequent builds to
      # the incremental delta. Keyed per target + vendored rift ref so
      # platforms and versions never share a cache.
      - name: Cache Rust build (rift-ffi)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rift-src
          key: ${{ matrix.target }}-${{ env.RIFT_REF }}

      - name: Build rift-ffi (release, cdylib)
        working-directory: rift-src
        run: cargo build --release -p rift-ffi --target ${{ matrix.target }}

      - name: Stage library
        run: |
          mkdir -p resources/prebuilds/${{ matrix.name }}
          cp "rift-src/target/${{ matrix.target }}/release/${{ matrix.lib }}" \
             "resources/prebuilds/${{ matrix.name }}/${{ matrix.lib }}"

      # darwin-x64 is cross-built here on Apple Silicon; running its x86_64
      # JVM for the binding test requires Rosetta 2. Idempotent / no-op when
      # already present.
      - name: Install Rosetta 2 (darwin-x64 cross test)
        if: matrix.rosetta
        run: softwareupdate --install-rosetta --agree-to-license

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          architecture: ${{ matrix.jdk-arch }}

      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest

      - name: Cache Clojure deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.clojure/.cpcache
          key: deps-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: |
            deps-${{ runner.os }}-

      # rift's Linux CoW backend is btrfs; GitHub Linux runners are ext4.
      # Provision a btrfs loopback FS and point java.io.tmpdir at it so the
      # real CoW round-trip runs on Linux too (macOS APFS already supports it).
      - name: Provision btrfs for real CoW (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq btrfs-progs
          truncate -s 3G /tmp/rift-btrfs.img
          mkfs.btrfs -q /tmp/rift-btrfs.img
          sudo mkdir -p /mnt/rift-btrfs
          sudo mount -o loop /tmp/rift-btrfs.img /mnt/rift-btrfs
          sudo chown -R "$(id -u):$(id -g)" /mnt/rift-btrfs
          echo "RIFT_TMPDIR=/mnt/rift-btrfs" >> "$GITHUB_ENV"

      # GATE: validate THIS platform's library against REAL rift before it can
      # be published. The full copy-on-write round-trip is mandatory on every
      # platform (macOS APFS, Linux btrfs) — no lenient fallback. A failure
      # here aborts the whole release.
      # Hard proof the darwin-x64 path is genuine: the staged dylib must be
      # Mach-O x86_64, and the JVM about to test it must itself be x86_64
      # running under Rosetta (proc_translated == 1 on the arm64 host).
      - name: Verify darwin-x64 is really x86_64 + Rosetta
        if: matrix.rosetta
        run: |
          echo "== built dylib arch =="
          file   resources/prebuilds/darwin-x64/librift_ffi.dylib
          lipo -archs resources/prebuilds/darwin-x64/librift_ffi.dylib
          echo "== test JVM arch =="
          "$JAVA_HOME/bin/java" -XshowSettings:properties -version 2>&1 | grep -i 'os.arch'
          echo "== host kernel arch (arm64) vs java binary arch (x86_64) =="
          echo "host uname -m: $(uname -m)"
          echo -n "java binary archs: "; lipo -archs "$JAVA_HOME/bin/java"
          # x86_64 java executing on an arm64 host => running under Rosetta 2.

      - name: Run binding tests against real rift (gates the release)
        run: clojure ${RIFT_TMPDIR:+-J-Djava.io.tmpdir=$RIFT_TMPDIR} -X:test

      - name: Upload validated library artifact
        uses: actions/upload-artifact@v7
        with:
          name: prebuild-${{ matrix.name }}
          path: resources/prebuilds/${{ matrix.name }}/${{ matrix.lib }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Mirror of svar's deploy.yml: changelog -> GitHub Release -> native Clojars
  # artifacts -> tiny main Clojars jar -> version-file bump committed back to main.
  # ---------------------------------------------------------------------------
  release:
    name: Release & Deploy to Clojars
    needs: natives
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch tags and changelog history
        run: |
          git fetch --tags --no-recurse-submodules origin
          git fetch --deepen=200 origin main

      - name: Download all platform libraries
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: prebuild-*

      - name: Place native libs into resources/prebuilds
        run: |
          set -euo pipefail
          for dir in artifacts/prebuild-*; do
            name="${dir#artifacts/prebuild-}"
            mkdir -p "resources/prebuilds/${name}"
            cp "${dir}"/* "resources/prebuilds/${name}/"
          done
          find resources/prebuilds -type f -print

      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest

      - name: Cache Clojure deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.clojure/.cpcache
          key: deps-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | head -n 2 | tail -n 1)
          CURRENT_TAG=${{ github.ref_name }}
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$CURRENT_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" $CURRENT_TAG)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" ${PREV_TAG}..${CURRENT_TAG})
          fi
          {
            echo "## What's Changed"
            echo ""
            echo "$CHANGELOG"
            echo ""
            echo "**Full Changelog**: https://github.com/Blockether/rift-clojure/compare/${PREV_TAG}...${CURRENT_TAG}"
          } > /tmp/release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: /tmp/release_body.md

      - name: Check if version exists on Clojars
        id: check-clojars
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://repo.clojars.org/com/blockether/rift/$VERSION/rift-$VERSION.jar")
          if [ "$STATUS" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Version $VERSION already exists on Clojars — skipping deploy"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & Deploy native jars to Clojars
        if: steps.check-clojars.outputs.exists != 'true'
        env:
          VERSION: ${{ github.ref_name }}
          CLOJARS_USERNAME: blockether-deployer
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          for platform in linux-x64 linux-arm64 darwin-arm64 darwin-x64; do
            clojure -T:build deploy-native :platform "${platform}"
          done

      - name: Build & Deploy main jar to Clojars
        if: steps.check-clojars.outputs.exists != 'true'
        env:
          VERSION: ${{ github.ref_name }}
          CLOJARS_USERNAME: blockether-deployer
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_DEPLOY_TOKEN }}
        run: clojure -T:build deploy

      - name: Update README.md version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/{:mvn\/version \"[^\"]*\"}/{:mvn\/version \"$VERSION\"}/g" README.md

      - name: Update CHANGELOG.md
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | head -n 2 | tail -n 1)
          CURRENT_TAG=${{ github.ref_name }}
          DATE=$(date +%Y-%m-%d)
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$CURRENT_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s" $CURRENT_TAG)
          else
            COMMITS=$(git log --pretty=format:"- %s" ${PREV_TAG}..${CURRENT_TAG})
          fi
          UNRELEASED_LINE=$(grep -n '^## \[Unreleased\]' CHANGELOG.md | head -1 | cut -d: -f1)
          if [ -z "$UNRELEASED_LINE" ]; then
            echo "ERROR: Could not find ## [Unreleased] section in CHANGELOG.md"
            exit 1
          fi
          {
            head -n "$UNRELEASED_LINE" CHANGELOG.md
            echo ""
            echo "## [$CURRENT_TAG] - $DATE"
            echo ""
            echo "### Changed"
            echo "$COMMITS"
            echo ""
            tail -n +$((UNRELEASED_LINE + 1)) CHANGELOG.md
          } > CHANGELOG.md.tmp && mv CHANGELOG.md.tmp CHANGELOG.md
          sed -i "s|\[Unreleased\]: .*|[Unreleased]: https://github.com/Blockether/rift-clojure/compare/${CURRENT_TAG}...HEAD|" CHANGELOG.md
          if ! grep -q "^\[${CURRENT_TAG}\]:" CHANGELOG.md; then
            echo "[$CURRENT_TAG]: https://github.com/Blockether/rift-clojure/releases/tag/${CURRENT_TAG}" >> CHANGELOG.md
          fi

      # Vendored binding: do NOT auto-bump. The version follows rift — the next
      # release happens when we vendor a new rift release and tag it. Pin
      # resources/VERSION to the just-released version so it stays consistent.
      - name: Pin VERSION to released rift version
        run: |
          echo "${GITHUB_REF_NAME#v}" > resources/VERSION

      - name: Commit version updates
        run: |
          git config user.name "blockether-deployer"
          git config user.email "contact@blockether.com"
          # Only version/doc files — NEVER the native binaries (CI-built, jar-only).
          git add README.md CHANGELOG.md resources/VERSION
          git diff --cached --quiet && echo "No changes to commit" || {
            git commit -m "release: update version files for ${{ github.ref_name }}"
            git push origin main
          }
