name: Release & Deploy to Clojars

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  # Vendored binding: build rift at exactly the version we are releasing.
  # Tag v0.0.8 => rift v0.0.8 => com.blockether/rift 0.0.8.
  RIFT_REF: ${{ github.ref_name }}

jobs:
  # ---------------------------------------------------------------------------
  # Build librift_ffi for every platform on a NATIVE runner (no qemu / no
  # cross-linker) AND run the Clojure binding test against the freshly-built
  # library on that same platform. fail-fast aborts the whole release if any
  # platform fails, and the `release` job has `needs: natives` — so NOTHING is
  # deployed to Clojars unless all four platforms built and tested green.
  # Each job uploads its validated library; the release job bundles them into
  # the published jar. Nothing is committed back to the repo.
  # ---------------------------------------------------------------------------
  natives:
    name: build + test ${{ matrix.name }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: linux-x64,    os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  lib: librift_ffi.so }
          - { name: linux-arm64,  os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, lib: librift_ffi.so }
          - { name: darwin-x64,   os: macos-13,         target: x86_64-apple-darwin,       lib: librift_ffi.dylib }
          - { name: darwin-arm64, os: macos-14,         target: aarch64-apple-darwin,      lib: librift_ffi.dylib }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout rift-clojure
        uses: actions/checkout@v4

      - name: Checkout rift source (${{ env.RIFT_REF }})
        uses: actions/checkout@v4
        with:
          repository: anomalyco/rift
          ref: ${{ env.RIFT_REF }}
          path: rift-src

      - name: Install cmake (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Install cmake (macOS)
        if: runner.os == 'macOS'
        run: brew list cmake >/dev/null 2>&1 || brew install cmake

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build rift-ffi (release, cdylib)
        working-directory: rift-src
        run: cargo build --release -p rift-ffi --target ${{ matrix.target }}

      - name: Stage library
        run: |
          mkdir -p resources/prebuilds/${{ matrix.name }}
          cp "rift-src/target/${{ matrix.target }}/release/${{ matrix.lib }}" \
             "resources/prebuilds/${{ matrix.name }}/${{ matrix.lib }}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: DeLaGuardo/setup-clojure@13.5
        with:
          cli: latest

      - name: Cache Clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.clojure/.cpcache
          key: deps-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: |
            deps-${{ runner.os }}-

      # rift's Linux CoW backend is btrfs; GitHub Linux runners are ext4.
      # Provision a btrfs loopback FS and point java.io.tmpdir at it so the
      # real CoW round-trip runs on Linux too (macOS APFS already supports it).
      - name: Provision btrfs for real CoW (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq btrfs-progs
          truncate -s 3G /tmp/rift-btrfs.img
          mkfs.btrfs -q /tmp/rift-btrfs.img
          sudo mkdir -p /mnt/rift-btrfs
          sudo mount -o loop /tmp/rift-btrfs.img /mnt/rift-btrfs
          sudo chown -R "$(id -u):$(id -g)" /mnt/rift-btrfs
          echo "RIFT_TMPDIR=/mnt/rift-btrfs" >> "$GITHUB_ENV"

      # GATE: validate THIS platform's library against REAL rift before it can
      # be published. RIFT_TEST_REQUIRE_COW makes the full copy-on-write
      # round-trip mandatory on every platform (macOS APFS, Linux btrfs) — no
      # lenient fallback. A failure here aborts the whole release.
      - name: Run binding tests against real rift (gates the release)
        env:
          RIFT_TEST_REQUIRE_COW: "1"
        run: clojure ${RIFT_TMPDIR:+-J-Djava.io.tmpdir=$RIFT_TMPDIR} -X:test

      - name: Upload validated library artifact
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.name }}
          path: resources/prebuilds/${{ matrix.name }}/${{ matrix.lib }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Mirror of svar's deploy.yml: changelog -> GitHub Release -> Clojars deploy
  # -> version-file bump committed back to main. The only difference is the
  # "place native libs" step that feeds the four artifacts into the jar.
  # ---------------------------------------------------------------------------
  release:
    name: Release & Deploy to Clojars
    needs: natives
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch tags and changelog history
        run: |
          git fetch --tags --no-recurse-submodules origin
          git fetch --deepen=200 origin main

      - name: Download all platform libraries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: prebuild-*

      - name: Place native libs into resources/prebuilds
        run: |
          set -euo pipefail
          for dir in artifacts/prebuild-*; do
            name="${dir#artifacts/prebuild-}"
            mkdir -p "resources/prebuilds/${name}"
            cp "${dir}"/* "resources/prebuilds/${name}/"
          done
          find resources/prebuilds -type f -print

      - uses: DeLaGuardo/setup-clojure@13.5
        with:
          cli: latest

      - name: Cache Clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.clojure/.cpcache
          key: deps-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | head -n 2 | tail -n 1)
          CURRENT_TAG=${{ github.ref_name }}
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$CURRENT_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" $CURRENT_TAG)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" ${PREV_TAG}..${CURRENT_TAG})
          fi
          {
            echo "## What's Changed"
            echo ""
            echo "$CHANGELOG"
            echo ""
            echo "**Full Changelog**: https://github.com/Blockether/rift-clojure/compare/${PREV_TAG}...${CURRENT_TAG}"
          } > /tmp/release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release_body.md

      - name: Check if version exists on Clojars
        id: check-clojars
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://repo.clojars.org/com/blockether/rift/$VERSION/rift-$VERSION.jar")
          if [ "$STATUS" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Version $VERSION already exists on Clojars — skipping deploy"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & Deploy to Clojars
        if: steps.check-clojars.outputs.exists != 'true'
        env:
          VERSION: ${{ github.ref_name }}
          CLOJARS_USERNAME: blockether-deployer
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_DEPLOY_TOKEN }}
        run: clojure -T:build deploy

      - name: Update README.md version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/{:mvn\/version \"[^\"]*\"}/{:mvn\/version \"$VERSION\"}/g" README.md

      - name: Update CHANGELOG.md
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | head -n 2 | tail -n 1)
          CURRENT_TAG=${{ github.ref_name }}
          DATE=$(date +%Y-%m-%d)
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$CURRENT_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s" $CURRENT_TAG)
          else
            COMMITS=$(git log --pretty=format:"- %s" ${PREV_TAG}..${CURRENT_TAG})
          fi
          UNRELEASED_LINE=$(grep -n '^## \[Unreleased\]' CHANGELOG.md | head -1 | cut -d: -f1)
          if [ -z "$UNRELEASED_LINE" ]; then
            echo "ERROR: Could not find ## [Unreleased] section in CHANGELOG.md"
            exit 1
          fi
          {
            head -n "$UNRELEASED_LINE" CHANGELOG.md
            echo ""
            echo "## [$CURRENT_TAG] - $DATE"
            echo ""
            echo "### Changed"
            echo "$COMMITS"
            echo ""
            tail -n +$((UNRELEASED_LINE + 1)) CHANGELOG.md
          } > CHANGELOG.md.tmp && mv CHANGELOG.md.tmp CHANGELOG.md
          sed -i "s|\[Unreleased\]: .*|[Unreleased]: https://github.com/Blockether/rift-clojure/compare/${CURRENT_TAG}...HEAD|" CHANGELOG.md
          if ! grep -q "^\[${CURRENT_TAG}\]:" CHANGELOG.md; then
            echo "[$CURRENT_TAG]: https://github.com/Blockether/rift-clojure/releases/tag/${CURRENT_TAG}" >> CHANGELOG.md
          fi

      # Vendored binding: do NOT auto-bump. The version follows rift — the next
      # release happens when we vendor a new rift release and tag it. Pin
      # resources/VERSION to the just-released version so it stays consistent.
      - name: Pin VERSION to released rift version
        run: |
          echo "${GITHUB_REF_NAME#v}" > resources/VERSION

      - name: Commit version updates
        run: |
          git config user.name "blockether-deployer"
          git config user.email "contact@blockether.com"
          # Only version/doc files — NEVER the native binaries (CI-built, jar-only).
          git add README.md CHANGELOG.md resources/VERSION
          git diff --cached --quiet && echo "No changes to commit" || {
            git commit -m "release: update version files for ${{ github.ref_name }}"
            git push origin main
          }
