name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-test:
    name: build + test ${{ matrix.name }}
    strategy:
      # CI: run every platform to completion so you see all results (deploy
      # uses fail-fast to abort the release on the first failure).
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,    os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  lib: librift_ffi.so }
          - { name: linux-arm64,  os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, lib: librift_ffi.so }
          - { name: darwin-arm64, os: macos-14,         target: aarch64-apple-darwin,      lib: librift_ffi.dylib }
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Vendored binding: the rift ref is whatever version we vendor.
      - name: Derive rift ref from resources/VERSION
        shell: bash
        run: echo "RIFT_REF=v$(tr -d '[:space:]' < resources/VERSION)" >> "$GITHUB_ENV"

      - name: Checkout rift source (${{ env.RIFT_REF }})
        uses: actions/checkout@v4
        with:
          repository: anomalyco/rift
          ref: ${{ env.RIFT_REF }}
          path: rift-src

      - name: Install cmake (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Install cmake (macOS)
        if: runner.os == 'macOS'
        run: brew list cmake >/dev/null 2>&1 || brew install cmake

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Cache the Cargo registry + rift-ffi target dir so the cdylib does NOT
      # cold-compile from scratch on every run. The cold release build of
      # rift-ffi + all transitive crates is what ballooned the old Intel-mac
      # (macos-13) job to ~14 min; a warm cache cuts subsequent builds to
      # the incremental delta. Keyed per target + vendored rift ref so
      # platforms and versions never share a cache.
      - name: Cache Rust build (rift-ffi)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rift-src
          key: ${{ matrix.target }}-${{ env.RIFT_REF }}

      - name: Build rift-ffi (release, cdylib)
        working-directory: rift-src
        run: cargo build --release -p rift-ffi --target ${{ matrix.target }}

      - name: Stage library
        run: |
          mkdir -p resources/prebuilds/${{ matrix.name }}
          cp "rift-src/target/${{ matrix.target }}/release/${{ matrix.lib }}" \
             "resources/prebuilds/${{ matrix.name }}/${{ matrix.lib }}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: DeLaGuardo/setup-clojure@13.5
        with:
          cli: latest

      - name: Cache Clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.clojure/.cpcache
          key: deps-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles('deps.edn') }}
          restore-keys: |
            deps-${{ runner.os }}-

      # rift's Linux CoW backend is btrfs; GitHub Linux runners are ext4.
      # Provision a btrfs loopback FS and point java.io.tmpdir at it so the
      # real CoW round-trip runs on Linux too (macOS APFS already supports it).
      - name: Provision btrfs for real CoW (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq btrfs-progs
          truncate -s 3G /tmp/rift-btrfs.img
          mkfs.btrfs -q /tmp/rift-btrfs.img
          sudo mkdir -p /mnt/rift-btrfs
          sudo mount -o loop /tmp/rift-btrfs.img /mnt/rift-btrfs
          sudo chown -R "$(id -u):$(id -g)" /mnt/rift-btrfs
          echo "RIFT_TMPDIR=/mnt/rift-btrfs" >> "$GITHUB_ENV"

      - name: Run tests against real rift (real CoW mandatory)
        shell: bash
        run: clojure ${RIFT_TMPDIR:+-J-Djava.io.tmpdir=$RIFT_TMPDIR} -X:test

      - name: Build jar
        run: clojure -T:build jar
