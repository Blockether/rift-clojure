name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Vendored binding: the rift ref is whatever version we vendor.
      - name: Derive rift ref from resources/VERSION
        run: echo "RIFT_REF=v$(tr -d '[:space:]' < resources/VERSION)" >> "$GITHUB_ENV"

      - name: Checkout rift source (${{ env.RIFT_REF }})
        uses: actions/checkout@v4
        with:
          repository: anomalyco/rift
          ref: ${{ env.RIFT_REF }}
          path: rift-src

      - name: Install cmake (libgit2-sys + bundled sqlite)
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Native libs are not committed; build the runner's lib so the binding
      # test has something to load. On ext4 the round-trip test falls back to
      # asserting the structured-error path — still exercises the FFM call.
      - name: Build native lib (linux-x64)
        working-directory: rift-src
        run: cargo build --release -p rift-ffi

      - name: Place lib for tests
        run: |
          mkdir -p resources/prebuilds/linux-x64
          cp rift-src/target/release/librift_ffi.so resources/prebuilds/linux-x64/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: DeLaGuardo/setup-clojure@13.5
        with:
          cli: latest

      - name: Cache Clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.clojure/.cpcache
          key: deps-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: |
            deps-${{ runner.os }}-

      # rift's Linux CoW backend is btrfs; GitHub runners are ext4. Provision a
      # btrfs loopback filesystem and point java.io.tmpdir at it so the test's
      # real create -> snapshot -> remove round-trip runs for real on Linux.
      - name: Provision btrfs for real CoW
        run: |
          sudo apt-get install -y -qq btrfs-progs
          truncate -s 3G /tmp/rift-btrfs.img
          mkfs.btrfs -q /tmp/rift-btrfs.img
          sudo mkdir -p /mnt/rift-btrfs
          sudo mount -o loop /tmp/rift-btrfs.img /mnt/rift-btrfs
          sudo chown -R "$(id -u):$(id -g)" /mnt/rift-btrfs

      - name: Run tests against real rift (real CoW mandatory)
        run: clojure -J-Djava.io.tmpdir=/mnt/rift-btrfs -X:test

      - name: Build jar
        run: clojure -T:build jar
