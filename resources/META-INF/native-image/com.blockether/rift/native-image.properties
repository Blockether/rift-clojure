# GraalVM native-image configuration for com.blockether/rift.
# Auto-applied when this jar is on the native-image classpath. Pairs with the
# reachability-metadata.json in this directory (the FFM downcall stubs).
#
# Why each flag:
#   --enable-native-access      the binding loads librift_ffi via SymbolLookup.
#                               libraryLookup and builds downcall handles through
#                               the Foreign Function & Memory API.
#   ForeignAPISupport           enables the FFM downcall stubs in the image.
#
# NO -H:+SharedArenaSupport: com.blockether.rift/bind! uses Arena.ofAuto (long-
# lived, GC-managed) for the library lookup and Arena.ofConfined (per-call) for
# each request — NEVER Arena.ofShared, which is INCOMPATIBLE with Truffle runtime
# compilation (an image that also embeds GraalPy fails with "Arena.ofShared is
# not supported with runtime compilations").
#
# The native library loads at RUN TIME from RIFT_NATIVE_PATH, the bundled
# prebuilds/<platform>/ resource, or — on a plain JVM only — the tools.deps
# download cache. In a native image bundle the matching
# com.blockether/rift-native-<platform> jar OR set RIFT_NATIVE_PATH.
Args = --enable-native-access=ALL-UNNAMED \
       -H:+UnlockExperimentalVMOptions \
       -H:+ForeignAPISupport
